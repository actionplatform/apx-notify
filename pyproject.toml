[project]
name = "apx-notify"
version = "0.0.0"
description = "Action Platform plugin: an organization's releases, deploys, readiness verdicts and failed release builds posted to Slack, Discord, Microsoft Teams or a signed webhook."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Action Platform", email = "cloud@actionplatform.io" }]
dependencies = ["action-platform>=0.34"]

[project.urls]
Repository = "https://github.com/actionplatform/apx-notify"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.entry-points."action_platform.plugins"]
notify = "apx_notify:NotifyPlugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apx_notify*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
